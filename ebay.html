<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="eBay変換">
<title>eBay英語変換ツール</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
html, body { margin: 0; padding: 0; background: #fff; }
#root { min-height: 100vh; }
.boot { padding: 60px 20px; text-align: center; font-family: sans-serif; color: #888; font-size: 13px; line-height: 2; }
</style>
</head>
<body>
<div id="root"><div class="boot">🌐<br>LOADING</div></div>
<script>
(function () {
  var v = window.location.search ? window.location.search.slice(1) : String(Date.now());
  function fail(msg) {
    document.getElementById("root").innerHTML =
      '<div class="boot">読み込みに失敗しました<br>' + String(msg) + '</div>';
  }
  fetch("ebay.jsx?v=" + encodeURIComponent(v))
    .then(function (r) {
      if (!r.ok) { throw new Error("ebay.jsx が見つかりません (" + r.status + ")"); }
      return r.text();
    })
    .then(function (code) {
      var fixed = code
        .replace(/[\u201C\u201D\u301D\u301E]/g, '"')
        .replace(/[\u2018\u2019]/g, "'");
      var out = Babel.transform(fixed, {
        presets: [["react", { runtime: "classic" }]]
      }).code;
      var s = document.createElement("script");
      s.textContent = out;
      document.body.appendChild(s);
    })
    .catch(function (e) { fail(e && e.message ? e.message : e); });
})();
</script>
</body>
</html>
