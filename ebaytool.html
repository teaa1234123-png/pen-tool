.lab { font-size: 11px; color: #888; margin-bottom: 5px; font-weight: bold; }
textarea { width: 100%; padding: 9px 12px; border: 1px solid #ccc; border-radius: 4px; color: #333; font-size: 13px; font-family: inherit; line-height: 1.7; resize: vertical; outline: none; background: #fff; }
button { font-family: inherit; cursor: pointer; }
.sub-btn { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 6px; background: #fafafa; color: #888; font-size: 12px; margin-top: 8px; }
.chk { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; margin: 12px 0; font-size: 13px; color: #555; }
.chk.on { border-color: #66bb6a; background: #f1f8e9; color: #2e7d32; }
.box { width: 18px; height: 18px; border: 2px solid #bbb; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; font-size: 12px; font-weight: bold; }
.chk.on .box { border-color: #2e7d32; background: #2e7d32; }
.chk .small { font-size: 11px; color: #888; }
.primary { width: 100%; padding: 16px; border: none; border-radius: 8px; background: #0064d2; color: #fff; font-size: 16px; font-weight: bold; letter-spacing: 0.05em; box-shadow: 0 2px 8px rgba(0,100,210,0.3); }
.warn { margin-top: 12px; padding: 12px 14px; background: #ffebee; border: 1px solid #ef5350; border-radius: 8px; font-size: 12px; color: #c62828; line-height: 1.8; }
.card { background: #fff; border: 2px solid #0064d2; border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.cardhd { background: #0064d2; color: #fff; padding: 9px 14px; font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
.cardbody { padding: 14px; }
.cnt { font-size: 11px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px; }
.cnt.over { background: #c62828; }
.copy { width: 100%; padding: 15px; border: none; border-radius: 8px; background: #0064d2; color: #fff; font-size: 15px; font-weight: bold; margin-top: 10px; }
.gt { width: 100%; padding: 14px; border: 2px solid #34a853; border-radius: 8px; background: #fff; color: #188038; font-size: 14px; font-weight: bold; margin-top: 8px; }
.pairbtn { width: 100%; padding: 11px; border: 1px solid #b0bec5; border-radius: 8px; background: #fff; color: #546e7a; font-size: 12px; margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { padding: 7px 11px; border: 1px solid #ccc; border-radius: 16px; background: #fff; color: #555; font-size: 12px; }
.chip.on { border-color: #0064d2; background: #0064d2; color: #fff; font-weight: bold; }
.sec { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.sechd { font-size: 11px; letter-spacing: 0.15em; color: #0064d2; padding: 14px 16px; font-family: monospace; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
.secbody { padding: 16px; font-size: 12px; line-height: 1.75; color: #455a64; border-top: 1px solid #e0e0e0; }
.romaji { margin-top: 10px; padding: 9px 11px; background: #e3f2fd; border-radius: 5px; font-size: 11px; color: #0d47a1; line-height: 1.7; }
.pairs { margin-top: 8px; border: 1px solid #cfd8dc; border-radius: 6px; overflow: hidden; }
.pair { padding: 5px 8px; border-top: 1px solid #f0f0f0; }
.pair.head { background: #eceff1; }
.pair .en { font-size: 11px; color: #1a237e; line-height: 1.35; }
.pair.head .en { font-weight: bold; }
.pair .jp { font-size: 10px; color: #78909c; line-height: 1.35; }
.note { padding: 12px 14px; background: #fff8e1; border: 1px solid #ffca28; border-radius: 8px; font-size: 12px; color: #5d4037; line-height: 1.7; }
.overmsg { font-size: 11px; color: #c62828; margin-top: 6px; font-weight: bold; display: none; }
.hide { display: none; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #37474f; color: #fff; padding: 10px 22px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; white-space: nowrap; }

  <div class="sub">EBAY TEXT CONVERTER</div>
  <h1>日本語出品 → eBay英語</h1>

<div class="wrap">
  <div class="lab">日本語タイトル</div>
  <textarea id="jt" rows="3" placeholder="1990s◆モンブラン 高級ボールペン ノブレス MONTBLANC ドイツ製"></textarea>
  <div class="lab" style="margin-top:12px">日本語 説明文</div>
  <textarea id="jb" rows="8" placeholder="メルカリの説明文をそのまま貼り付け"></textarea>
  <button id="clear" class="sub-btn">入力をクリア</button>

  <div id="chk" class="chk"><span class="box" id="chkbox"></span><span>機構の動作を確認した<span class="small">（未確認ならOFF）</span></span></div>

<button id="run" class="primary">🌐 eBay英語に変換する</button>

  <div id="warn" class="warn hide"></div>

  <div id="result" class="hide">
    <div class="sec">
      <div class="sechd" id="sechd"><span>── 読み取り結果を確認</span><span id="arrow">▶</span></div>
      <div class="secbody hide" id="det"></div>
    </div>

<div class="card">
  <div class="cardhd"><span>TITLE</span><span class="cnt" id="len">0 / 80</span></div>
  <div class="cardbody">
    <div class="lab">先頭の売り文句</div>
    <div class="chips" id="hooks"></div>
    <textarea id="et" rows="3"></textarea>
    <div class="overmsg" id="over">⚠ 80文字を超えています</div>
    <button id="copyT" class="copy">📋 タイトルをコピー</button>
  </div>
</div>

<div class="card">
  <div class="cardhd"><span>DESCRIPTION</span></div>
  <div class="cardbody">
    <textarea id="eb" rows="14"></textarea>
    <button id="copyB" class="copy">📋 説明文をコピー</button>
    <button id="gt" class="gt">🌐 Google翻訳で日本語に訳す</button>

    <div id="pairs" class="pairs hide"></div>
  </div>
</div>

function kanaToRomaji(s) {
  var out = "";
  var i = 0;
  while (i < s.length) {
    var two = s.substr(i, 2);
    if (KANA_MAP[two] !== undefined) { out += KANA_MAP[two]; i += 2; continue; }

    if (KANA_MAP[one] !== undefined) { out += KANA_MAP[one]; i += 1; continue; }
    out += one; i += 1;
  }
  return out.charAt(0).toUpperCase() + out.slice(1);
}

function findOne(t, list) { for (var i = 0; i < list.length; i++) if (t.indexOf(list[i].jp) >= 0) return list[i]; return null; }
function findAll(t, list) { var o = []; for (var i = 0; i < list.length; i++) if (t.indexOf(list[i].jp) >= 0) o.push(list[i]); return o; }
function pickField(t, label) { var m = t.match(new RegExp("【" + label + "】([^\n]*)")); return m ? m[1].trim() : ""; }
function extractEra(t) {
  var m = t.match(/(\d{4})年代/); if (m) return m[1].replace(/(\d{3})\d/, "$1") + "0s";
  var m2 = t.match(/(\d{4})s/); if (m2) return m2[1] + "s";
  return "";
}

// 「1993〜1995年」のような製造期間を拾う
function extractProduction(t) {
  var m = t.match(/(\d{4})\s*年?\s*[\u301C\uFF5E\u2013\u2014\u2015\u30FC\uFF0D\-~]\s*(\d{4})\s*年/);
  if (m) return { from: m[1], to: m[2] };
  return null;
}

// 「1995年だけ製造」のような単年の製造表記
function extractSingleYear(t) {
  var m = t.match(/(\d{4})\s*年(?:に|の)?\s*(?:のみ|だけ)?\s*(?:製造|生産)/);
  if (m) return m[1];
  return null;
}

// 「刻印より、1993年に製造されたものだと推察されます」
function extractStampedYear(t) {
  var sents = t.split(/[。\n]/);
  for (var i = 0; i < sents.length; i++) {
    if (sents[i].indexOf("刻印") >= 0 || sents[i].indexOf("刻印より") >= 0) {
      var m = sents[i].match(/(\d{4})\s*年/);
      if (m) return m[1];
    }
  }
  return null;
}

// 刻印の文を除いた本文（製造年の二重検出を避ける）
function withoutStampSentences(t) {
  var sents = t.split(/[。\n]/);
  var keep = [];
  for (var i = 0; i < sents.length; i++) {
    if (sents[i].indexOf("刻印") < 0) keep.push(sents[i]);
  }
  return keep.join("。");
}

var RARE_WORDS = ["短い期間", "短期間", "わずかな期間", "希少", "貴重", "レアな", "生産数が少な", "入手困難", "幻の"];
function hasRarity(t) {
  for (var i = 0; i < RARE_WORDS.length; i++) if (t.indexOf(RARE_WORDS[i]) >= 0) return true;
  return false;
}

// 長い語から順にマッチさせる（部分一致による誤分割を防ぐ）
var MODELS_SORTED = MODELS.slice().sort(function (a, b) { return b.jp.length - a.jp.length; });

function translateModel(jp) {
  if (!jp) return { en: "", romanized: "", leftover: "" };

  var words = jp.split(/[\u30fb\s\u3000,\u3001]+/).filter(function (x) { return x; });
  var out = [], romanized = [], leftover = [];

  function decompose(w) {
    var parts = [], romaji = [];
    var rest = w;
    var buf = "";
    var guard = 0;

    function flushBuf() {
      if (!buf) return;
      if (/^[\u30A0-\u30FF]+$/.test(buf)) {
        var r = kanaToRomaji(buf);
        parts.push(r);
        romaji.push({ jp: buf, en: r });
      } else {
        parts.push(buf);
      }
      buf = "";
    }

    while (rest.length > 0 && guard++ < 200) {
      var hit = null;
      for (var i = 0; i < MODELS_SORTED.length; i++) {
        if (MODELS_SORTED[i].jp.length >= 2 && rest.indexOf(MODELS_SORTED[i].jp) === 0) {
          hit = MODELS_SORTED[i]; break;
        }
      }
      if (hit) {
        flushBuf();
        parts.push(hit.en);
        rest = rest.slice(hit.jp.length);
      } else {
        buf += rest.charAt(0);
        rest = rest.slice(1);
      }
    }
    flushBuf();
    return { parts: parts, romaji: romaji };
  }

  for (var n = 0; n < words.length; n++) {
    var w = words[n];

    if (/^[A-Za-z0-9#&.\-]+$/.test(w)) { out.push(w); continue; }

    var d = decompose(w);
    var hasUntranslatable = false;
    for (var z = 0; z < d.parts.length; z++) {
      if (/[\u3041-\u3096\u4E00-\u9FFF]/.test(d.parts[z])) { hasUntranslatable = true; break; }
    }
    if (hasUntranslatable) {
      var okParts = [];
      for (var z2 = 0; z2 < d.parts.length; z2++) {
        if (/[\u3041-\u3096\u4E00-\u9FFF]/.test(d.parts[z2])) leftover.push(d.parts[z2]);
        else okParts.push(d.parts[z2]);
      }
      if (okParts.length) out.push(okParts.join(" "));
      for (var q0 = 0; q0 < d.romaji.length; q0++) {
        romanized.push(d.romaji[q0].jp + "\u2192" + d.romaji[q0].en);
      }
      continue;
    }

    if (d.parts.length) {
      out.push(d.parts.join(" "));
      for (var q = 0; q < d.romaji.length; q++) {
        romanized.push(d.romaji[q].jp + "\u2192" + d.romaji[q].en);
      }
    }
  }

  return {
    en: out.join(" ").replace(/\s+/g, " ").trim(),
    romanized: romanized.join("\u3001"),
    leftover: leftover.join(" ")
  };
}

// 先頭の売り文句（hook）＋各要素からタイトルを作る。80文字を超えたら後ろから削る。
function buildTitle(hook, parts) {
  var head = hook ? hook + "◆" : "";
  var p = [];
  for (var i = 0; i < parts.length; i++) {
    if (!parts[i]) continue;
    if (hook && parts[i].toLowerCase() === hook.toLowerCase()) continue;
    p.push(parts[i]);
  }
  var t = (head + p.join(" ")).replace(/\s+/g, " ").trim();
  while (t.length > 80 && p.length > 2) {
    p.splice(p.length - 1, 1);
    t = (head + p.join(" ")).replace(/\s+/g, " ").trim();
  }
  if (t.length > 80) t = t.slice(0, 80).trim();
  return t;
}

function convertListing(jpTitle, jpBody, tested) {
  var all = jpTitle + "\n" + jpBody;

  // ブランド判定：タイトル優先。本文は「プラチナメッキ」等を除いてから見る。

  var brand = findOne(jpTitle, BRANDS) || findOne(bodyForBrand, BRANDS);

  // ペン種は「タイトル優先」。本文の他出品誤検出を防ぐ。
  var penType = findOne(jpTitle, PENTYPES);
  var penTypeSource = "タイトル";
  if (!penType) {
    var typeField = pickField(jpBody, "タイプ");
    if (typeField) { penType = findOne(typeField, PENTYPES); penTypeSource = "【タイプ】欄"; }
  }
  if (!penType) {
    penType = findOne(jpBody.slice(0, 200), PENTYPES);
    penTypeSource = "本文冒頭";
  }
  var penCandidates = findAll(jpTitle + "\n" + jpBody.slice(0, 200), PENTYPES);
  var penAmbiguous = penCandidates.length > 1;

  function resolveField(label, list, fallbackText) {
    var fv = pickField(jpBody, label);
    if (!fv) {
      var h2 = findOne(fallbackText, list);
      return h2 ? { en: h2.en, short: h2.short || h2.en, raw: "", obj: h2 } : { en: "", short: "", raw: "", obj: null };
    }

    var outside = fv.replace(/[\uff08(][^\uff09)]*[\uff09)]/g, "").trim();
    var inside = (fv.match(/[\uff08(]([^\uff09)]*)[\uff09)]/) || [])[1] || "";
    var core = outside || fv;

    for (var e1 = 0; e1 < list.length; e1++) {
      if (list[e1].jp === core || list[e1].jp === fv) {
        return { en: list[e1].en, short: list[e1].short || list[e1].en, raw: fv, obj: list[e1] };
      }
    }

    var tr = translateModel(core);
    var covered = !tr.romanized && !tr.leftover;
    var hit = findOne(core, list) || findOne(inside, list) || findOne(fv, list);

    if (tr.en && covered) {
      return { en: tr.en, short: (hit && hit.short) || tr.en, raw: fv, obj: hit };
    }
    if (hit) return { en: hit.en, short: hit.short || hit.en, raw: fv, obj: hit };
    if (tr.en) return { en: tr.en, raw: fv, obj: null, romanized: tr.romanized, leftover: tr.leftover };
    return { en: "", raw: fv, obj: null };
  }

  var matR = resolveField("素材", MATERIALS, all);
  var material = matR.obj;
  var materialEn = matR.en;

  var colR = resolveField("カラー", COLORS, all);
  var colorEn = colR.en;

  var country = findOne(all, COUNTRIES);
  var era = extractEra(all);
  var prod = extractProduction(all);
  var stamped = extractStampedYear(all);
  var single = prod ? null : extractSingleYear(withoutStampSentences(all));
  var rare = hasRarity(all);
  // 年代の記載がなければ、製造年から作る
  if (!era && prod) era = prod.from.slice(0, 3) + "0s";
  if (!era && single) era = single.slice(0, 3) + "0s";
  if (!era && stamped) era = stamped.slice(0, 3) + "0s";
  var specs = findAll(all, SPECS);
  var accs = findAll(all, ACCS);

  var modelJp = pickField(jpBody, "モデル");
  if (!modelJp) {
    var t = jpTitle;
    t = t.replace(/\d{4}s?◆?/g, "");
    BRANDS.forEach(function (b) { t = t.split(b.jp).join(" "); });
    PENTYPES.forEach(function (p) { t = t.split("高級" + p.jp).join(" ").split(p.jp).join(" "); });
    COUNTRIES.forEach(function (c) { t = t.split(c.jp).join(" "); });
    modelJp = t.replace(/[（）()]/g, " ").replace(/\s+/g, " ").trim();
  }
  var mt = translateModel(modelJp);
  var model = mt.en;

  var priceField = pickField(jpBody, "定価");
  var mgmtMatch = jpBody.match(/\b(\d{8})\b/);
  var mgmt = mgmtMatch ? mgmtMatch[1] : "";

  var cond = null, condSrc = "";
  for (var i = 0; i < CONDITIONS.length && !cond; i++) {
    for (var j = 0; j < CONDITIONS[i].jp.length; j++) {
      if (jpBody.indexOf(CONDITIONS[i].jp[j]) >= 0) {
        cond = CONDITIONS[i];
        condSrc = CONDITIONS[i].jp[j];
        break;
      }
    }
  }
  if (!cond) {
    cond = { grade: "Used", txt: "Sold as a used item. Please refer to the photos for the exact condition." };
    condSrc = "（状態の記述が見つからず、既定値を使用）";
  }

  var parts = [];
  if (brand) parts.push(brand.en);
  if (model) parts.push(model);
  var materialShort = matR.short || materialEn;
  if (materialShort && materialShort.indexOf("Sterling Silver") === 0) materialShort = "Sterling Silver";
  var modelLow = (model || "").toLowerCase();
  if (materialShort && materialShort !== "Metal" && modelLow.indexOf(materialShort.toLowerCase()) < 0) parts.push(materialShort);
  if (penType) parts.push(penType.en);
  // 素材名に同じ色が入っている場合はタイトルで重複させない
  var matLow = (materialShort || "").toLowerCase();
  if (colorEn && matLow.indexOf(colorEn.toLowerCase()) < 0) parts.push(colorEn);
  if (country) parts.push(country.en);
  if (era) parts.push(era);

  // 先頭に置く売り文句の候補（左が最優先）
  var hooks = [];
  function pushHook(h) {
    if (!h) return;
    for (var hi = 0; hi < hooks.length; hi++) if (hooks[hi].toLowerCase() === h.toLowerCase()) return;
    hooks.push(h);
  }
  if (cond.grade === "New Old Stock") pushHook("UNUSED");
  if (rare || prod) pushHook("RARE");
  if (material && (material.asset === "gold" || material.asset === "silver")) pushHook(materialShort);
  if (era) pushHook(era);
  if (cond.grade === "Excellent") pushHook("MINT");
  if (era) pushHook("VINTAGE");
  if (materialShort && materialShort !== "Metal") pushHook(materialShort);
  pushHook("なし");

  var title = buildTitle(hooks[0] === "なし" ? "" : hooks[0], parts);

  var L = [], PAIRS = [];
  function add(en, jp) {
    L.push(en);
    if (en !== "") PAIRS.push({ en: en, jp: jp || "" });
  }

  var bn = brand ? brand.en : "";
  var pt = penType ? penType.en : "Pen";

  add((bn + " " + model).trim() + " \u2014 " + pt,
    (brand ? brand.jp : "") + " " + modelJp + "、" + (penType ? penType.jp : ""));
  add("");

  if (era) {
    add("Vintage " + era + " model. Discontinued and no longer in production.",
      era + "頃のヴィンテージモデル。現在は生産終了・廃盤。");
    add("");
  }
  if (prod && rare) {
    add("This model was produced only for a short period, from " + prod.from + " to " + prod.to + ", which makes it very hard to find today.",
      prod.from + "〜" + prod.to + "年の短い期間だけ製造された、大変貴重なモデルです。");
    add("");
  } else if (prod) {
    add("Produced from " + prod.from + " to " + prod.to + ".",
      prod.from + "〜" + prod.to + "年に製造されたモデルです。");
    add("");
  } else if (single && rare) {
    add("This model was produced only in " + single + ", which makes it very hard to find today.",
      single + "年だけ製造された、大変貴重なモデルです。");
    add("");
  } else if (single) {
    add("Produced in " + single + ".", single + "年に製造されたモデルです。");
    add("");
  } else if (rare) {
    add("A rare model that is difficult to find today.",
      "現在では入手が難しい、希少なモデルです。");
    add("");
  }
  if (stamped) {
    add("Based on the engraved markings, this pen is believed to have been produced in " + stamped + ".",
      "刻印より、" + stamped + "年に製造されたものだと推察されます。");
    add("");
  }
  if (material && material.asset === "gold") {
    add(materialEn + ". With rising gold prices, this piece also holds value as an asset.",
      materialEn + "。金価格の高騰により、資産としての価値もあります。");
    add("");
  } else if (material && material.asset === "silver") {
    add(materialEn + ". With rising silver prices, this piece also holds value as an asset.",
      materialEn + "。銀価格の高騰により、資産としての価値もあります。");
    add("");
  }

  add("== SPECIFICATIONS ==", "【仕様】");
  if (bn) add("Brand: " + bn, "【ブランド】" + brand.jp);
  if (model) add("Model: " + model, "【モデル】" + modelJp);
  if (priceField) add("Original retail price: JPY " + priceField.replace(/[^\d,]/g, ""),
    "【定価】" + priceField + "円");
  add("Type: " + pt, "【タイプ】" + (penType ? penType.jp : ""));
  if (materialEn) add("Material: " + materialEn, "【素材】" + (matR.raw || (material ? material.jp : "")));
  if (colorEn) add("Color: " + colorEn, "【カラー】" + (colR.raw || ""));
  if (country) add("Made in: " + country.en + (era ? " (" + era + ")" : ""),
    "【製造】" + country.jp + (era ? "（" + era + "）" : ""));
  if (specs.length) add("Mechanism: " + specs.map(function (s) { return s.en; }).join(" / "),
    "【仕様】" + specs.map(function (s) { return s.jp; }).join("・"));
  if (accs.length) add("Included: " + accs.map(function (a) { return a.en; }).join(", "),
    "【付属品】" + accs.map(function (a) { return a.jp; }).join("、"));
  add("");

  add("== CONDITION: " + cond.grade + " ==", "【状態】" + cond.grade);
  add(cond.txt, "日本語原文：" + condSrc);

  var isMech = penType && (penType.en === "Ballpoint Pen" || penType.en === "Rollerball Pen" || penType.en === "Mechanical Pencil" || penType.en === "Multi Pen");
  var mechName = "The mechanism";
  var mechJp = "機構";
  if (specs.length) {
    if (specs[0].jp === "ツイスト式") { mechName = "The twist mechanism"; mechJp = "ツイスト機構"; }
    else if (specs[0].jp === "ノック式") { mechName = "The click mechanism"; mechJp = "ノック機構"; }
  }
  var refillDepleted = jpBody.indexOf("替芯の交換") >= 0;

  if (tested && isMech) {
    add(mechName + " has been tested and operates smoothly.",
      mechJp + "の動作を確認済みです。（チェックをONにしたため）");
    if (refillDepleted) add("The refill is depleted, so please replace it before use.",
      "ご使用の際には替芯の交換をお願いします。");
  } else if (refillDepleted) {
    add("The refill is depleted, so please replace it before use.",
      "ご使用の際には替芯の交換をお願いします。");
    add("The mechanism has not been fully tested. Please refer to the photos and ask if you have any questions.",
      "機構の動作は未確認です。（チェックがOFFのため）");
  } else if (isMech) {
    add("This item has not been fully tested and is sold as-is. Please refer to the photos and ask if you have any questions.",
      "未確認のため現状渡しです。（チェックがOFFのため）");
  }
  if (jpBody.indexOf("多少の汚れ") >= 0) {
    add("The included accessories show stains or wear from age.",
      "付属品には多少の汚れ等があります。");
  }
  add("");
  add("This is a pre-owned vintage item and is sold as-is. Please review all photos carefully, as they are part of the description. If you have any concerns about the condition, please ask before purchasing.",
    "中古のヴィンテージ品のため現状渡しです。写真も説明の一部ですのでご確認ください。状態にご不安があればご購入前にお尋ねください。（クレーム対策の定型文）");
  add("");
  add("Feel free to ask any questions. Thank you for looking!",
    "ご質問お気軽にどうぞ。ご覧いただきありがとうございます。");
  if (mgmt) { add(""); add("[ " + mgmt + " ]", "管理番号"); }

  return {
    title: title,
    titleParts: parts,
    hooks: hooks,
    body: L.join("\n").replace(/\n{3,}/g, "\n\n").trim(),
    pairs: PAIRS,
    detected: {
      brand: brand ? brand.en : "(未検出)",
      modelJp: modelJp || "(未検出)",
      model: model || "(未検出)",
      romanized: mt.romanized,
      leftover: mt.leftover,
      penTypeSource: penTypeSource,
      penAmbiguous: penAmbiguous,
      penCandidates: penCandidates.map(function (x) { return x.jp; }).join("、"),
      penType: penType ? penType.en : "(未検出)",
      material: materialEn || "(未検出)",
      color: colorEn || "(未検出)",
      colorRaw: colR.raw,
      materialRaw: matR.raw,
      country: country ? country.en : "(未検出)",
      era: era || "(未検出)",
      production: prod ? prod.from + "〜" + prod.to : (single ? single + "年" : (stamped ? "刻印より " + stamped + "年" : "(未検出)")),
      rare: rare,
      condition: cond.grade
    }
  };
}

// ここから画面の制御

function $(id) { return document.getElementById(id); }

var ST = { tested: false, parts: [], hooks: [], hook: "", pairs: [], showPairs: false, open: false };
var toastTimer = null;

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function toast(m) {
  var t = $("toast");
  t.textContent = m;
  t.style.opacity = 1;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.opacity = 0; }, 2200);
}

function copyText(text, label) {
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "✓ " + label + "をコピー" : "⚠ コピーできませんでした");
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      toast("✓ " + label + "をコピー");
    }, fallback);
  } else {
    fallback();
  }
}

function updateLen() {
  var n = $("et").value.length;
  $("len").textContent = n + " / 80";
  $("len").className = n > 80 ? "cnt over" : "cnt";
  $("over").style.display = n > 80 ? "block" : "none";
}

function renderHooks() {
  var box = $("hooks");
  box.innerHTML = "";
  for (var i = 0; i < ST.hooks.length; i++) {
    (function (h) {
      var b = document.createElement("button");
      b.className = "chip" + (h === ST.hook ? " on" : "");
      b.textContent = h === "なし" ? "なし" : h + "◆";
      b.onclick = function () {
        ST.hook = h;
        $("et").value = buildTitle(h === "なし" ? "" : h, ST.parts);
        updateLen();
        renderHooks();
      };
      box.appendChild(b);
    })(ST.hooks[i]);
  }
}

function renderDetected(d) {
  var rows = [
    ["Brand", d.brand],
    ["Model", d.model],
    ["Type", d.penType + "（" + d.penTypeSource + "）"],
    ["Material", d.material + (d.materialRaw ? "（" + d.materialRaw + "）" : "")],
    ["Color", d.color + (d.colorRaw ? "（" + d.colorRaw + "）" : "")],
    ["Made in", d.country],
    ["Era", d.era],
    ["製造期間", d.production + (d.rare ? "（希少と判定）" : "")],
    ["Condition", d.condition]
  ];
  var html = "";
  for (var i = 0; i < rows.length; i++) {
    html += "<div>" + esc(rows[i][0]) + "：" + esc(rows[i][1]) + "</div>";
  }
  if (d.romanized) {
    html += '<div class="romaji">ローマ字化した部分：<strong>' + esc(d.romanized) + "</strong></div>";
  }
  $("det").innerHTML = html;
}

function renderPairs() {
  var box = $("pairs");
  var html = "";
  for (var i = 0; i < ST.pairs.length; i++) {
    var p = ST.pairs[i];
    var isHead = p.en.indexOf("==") === 0;
    html += '<div class="pair' + (isHead ? " head" : "") + '">';
    html += '<div class="en">' + esc(p.en) + "</div>";
    html += '<div class="jp">' + esc(p.jp || "（定型文）") + "</div>";
    html += "</div>";
  }
  box.innerHTML = html;
}

function run() {
  var jt = $("jt").value;
  var jb = $("jb").value;
  if (!jt && !jb) { toast("⚠ タイトルか本文を入力してください"); return; }

  var r;
  try {
    r = convertListing(jt, jb, ST.tested);
  } catch (e) {
    toast("⚠ 変換でエラー: " + (e && e.message ? e.message : e));
    return;
  }

  ST.parts = r.titleParts || [];
  ST.hooks = r.hooks || [];
  ST.hook = ST.hooks.length ? ST.hooks[0] : "";
  ST.pairs = r.pairs || [];
  ST.showPairs = false;

  $("et").value = r.title;
  $("eb").value = r.body;
  $("result").className = "";
  $("pairs").className = "pairs hide";
  $("pairbtn").textContent = "対訳表を見る（元の日本語との対応）";

  renderHooks();
  renderDetected(r.detected);
  renderPairs();
  updateLen();

  var w = "";
  if (r.detected.penAmbiguous) {
    w += "<div>⚠ ペンの種類が複数見つかりました。<strong>" + esc(r.detected.penType) + "</strong> と判定。違えば直してください。</div>";
  }
  if (r.detected.leftover) {
    w += "<div>⚠ <strong>「" + esc(r.detected.leftover) + "」</strong>は英訳できませんでした。</div>";
  }
  $("warn").innerHTML = w;
  $("warn").className = w ? "warn" : "warn hide";

  toast("✓ 変換しました");
}

function openTranslate() {
  var txt = ($("eb").value || "").trim();
  if (!txt) { toast("⚠ 説明文がありません"); return; }
  var url = "https://translate.google.com/?sl=en&tl=ja&op=translate&text=" + encodeURIComponent(txt);
  if (url.length <= 1900) { window.open(url, "_blank"); return; }
  copyText(txt, "説明文");
  setTimeout(function () {
    window.open("https://translate.google.com/?sl=en&tl=ja&op=translate", "_blank");
  }, 600);
}

$("run").onclick = run;

$("clear").onclick = function () {
  $("jt").value = "";
  $("jb").value = "";
  $("et").value = "";
  $("eb").value = "";
  $("result").className = "hide";
  $("warn").className = "warn hide";
};

$("chk").onclick = function () {
  ST.tested = !ST.tested;
  $("chk").className = ST.tested ? "chk on" : "chk";
  $("chkbox").textContent = ST.tested ? "✓" : "";
};

$("sechd").onclick = function () {
  ST.open = !ST.open;
  $("det").className = ST.open ? "secbody" : "secbody hide";
  $("arrow").textContent = ST.open ? "▼" : "▶";
};

$("copyT").onclick = function () { copyText($("et").value, "タイトル"); };
$("copyB").onclick = function () { copyText($("eb").value, "説明文"); };
$("gt").onclick = openTranslate;

$("pairbtn").onclick = function () {
  ST.showPairs = !ST.showPairs;
  $("pairs").className = ST.showPairs ? "pairs" : "pairs hide";
  $("pairbtn").textContent = ST.showPairs ? "▲ 対訳表を閉じる" : "対訳表を見る（元の日本語との対応）";
};

$("et").oninput = updateLen;

</script>

</body>
