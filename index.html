<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="出品ツール">
<title>5品まとめ出品ツール</title>
<style>
  html,body{margin:0;padding:0;background:#fff;-webkit-text-size-adjust:100%;}
  #boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:linear-gradient(135deg,#1a1200,#3a2800);color:#c8a84b;
        font-family:'Hiragino Kaku Gothic ProN',sans-serif;padding:24px;text-align:center;}
  #boot .mark{font-size:28px;margin-bottom:10px;}
  #boot .lead{font-size:10px;letter-spacing:.3em;font-family:monospace;opacity:.75;}
  #err{display:none;min-height:100vh;background:#1a1200;color:#ffb4a2;padding:20px;
       font-family:ui-monospace,monospace;font-size:12px;line-height:1.7;white-space:pre-wrap;
       word-break:break-all;-webkit-user-select:text;user-select:text;}
  #err b{color:#ffd7c2;font-size:13px;}
</style>
</head>
<body>

<div id="root"></div>
<div id="boot"><div class="mark">✒️</div><div class="lead">LOADING</div></div>
<div id="err"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script>
(function () {
  var boot = document.getElementById('boot');
  var errBox = document.getElementById('err');

  function fail(title, detail) {
    boot.style.display = 'none';
    errBox.style.display = 'block';
    errBox.innerHTML = '<b>' + title + '</b>\n\n' +
      String(detail).replace(/[<>&]/g, function (c) {
        return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c];
      });
  }

  // --- app.jsx を読み込む（?v= はiPhoneのキャッシュ対策）---
  fetch('app.jsx?v=' + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error('app.jsx が見つかりません (HTTP ' + r.status + ')');
      return r.text();
    })
    .then(function (src) {
      var code = src;

      // import 文を削除（React は下でグローバルから渡す）
      code = code.replace(/^[ \t]*import[\s\S]*?from[ \t]*["'][^"']+["'][ \t]*;?[ \t]*$/gm, '');
      code = code.replace(/^[ \t]*import[ \t]*["'][^"']+["'][ \t]*;?[ \t]*$/gm, '');

      // export default を外して、起動する関数名を特定する
      var appName = null;
      code = code.replace(
        /^[ \t]*export[ \t]+default[ \t]+function[ \t]+([A-Za-z0-9_$]+)/m,
        function (m, n) { appName = n; return 'function ' + n; }
      );
      if (!appName) {
        code = code.replace(
          /^[ \t]*export[ \t]+default[ \t]+([A-Za-z0-9_$]+)[ \t]*;?[ \t]*$/m,
          function (m, n) { appName = n; return ''; }
        );
      }
      if (!appName) {
        code = code.replace(/^[ \t]*export[ \t]+default[ \t]+/m, 'var __APP__ = ');
        appName = '__APP__';
      }
      // 残りの export キーワードも外す
      code = code.replace(/^[ \t]*export[ \t]+(?=(function|const|let|var|class)[ \t])/gm, '');

      var hooks =
        'var useState=React.useState,useEffect=React.useEffect,useRef=React.useRef,' +
        'useMemo=React.useMemo,useCallback=React.useCallback,useReducer=React.useReducer,' +
        'useLayoutEffect=React.useLayoutEffect,useContext=React.useContext,' +
        'createContext=React.createContext,Fragment=React.Fragment,memo=React.memo;\n';

      var wrapped =
        '(function(){\n' + hooks + code +
        '\n; return typeof ' + appName + ' !== "undefined" ? ' + appName + ' : null;\n})()';

      var out;
      try {
        out = Babel.transform(wrapped, { presets: ['react'] }).code;
      } catch (e) {
        return fail('app.jsx の文法エラーです', e.message);
      }

      var App;
      try {
        App = eval(out);
      } catch (e) {
        return fail('app.jsx の実行時エラーです', e.message + '\n\n' + (e.stack || ''));
      }
      if (!App) return fail('起動できません', 'app.jsx の中に export default の関数が見つかりませんでした。');

      try {
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
        boot.style.display = 'none';
      } catch (e) {
        fail('画面の描画に失敗しました', e.message + '\n\n' + (e.stack || ''));
      }
    })
    .catch(function (e) { fail('読み込みに失敗しました', e.message); });

  window.addEventListener('error', function (ev) {
    if (errBox.style.display === 'block') return;
    fail('エラーが発生しました', ev.message + '\n' + (ev.filename || '') + ':' + (ev.lineno || ''));
  });
})();
</script>

</body>
</html>
