word-break:break-all;-webkit-user-select:text;user-select:text;}
#err b{color:#ffd7c2;font-size:14px;display:block;margin-bottom:8px;}

padding:10px 22px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;

.toast.on{opacity:1;}

<div class="head">
  <div class="mark">✒️✒️✒️</div>
  <div class="lead">MERCARI / EBAY LISTING TOOL</div>
  <h1>5品まとめ出品ツール</h1>
</div>

<div class="tabs" id="tabs"></div>

<div class="wrap">
  <div id="panes"></div>

  <div class="batch">
    <div class="batchCap">── まとめて生成 ──</div>
    <div class="stRow" id="batchStatus"></div>
    <button id="genAll">🚀 ① ② ③ ④ ⑤ 全品まとめて生成する</button>
  </div>

  <div id="results"></div>
</div>

<div class="toast" id="toast"></div>
<div id="err"></div>

<script>
(function () {
  function show(title, detail) {
    var box = document.getElementById("err");
    if (!box || box.style.display === "block") return;
    box.style.display = "block";
    box.innerHTML = "<b>" + title + "</b>" +
      String(detail).replace(/[<>&]/g, function (c) {
        return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c];
      });
  }
  window.penShowError = show;
  window.onerror = function (msg, src, line, col, e) {
    show("エラーが発生しました", msg + "\n\n行: " + line + " 文字: " + col);
    return false;
  };
  setTimeout(function () {
    var t = document.getElementById("tabs");
    if (t && t.children.length === 0) {
      show("起動できませんでした",
        "タブが作られていません。ファイルが途中で切れている可能性が高いです。\n" +
        "GitHub で pen.html を開き、いちばん下が </html> で終わっているか確認してください。");
    }
  }, 1500);
})();
</script>

    flushBuf();
    return { parts: parts, romaji: romaji };
  }

  for (var n = 0; n < words.length; n++) {
    var w = words[n];

    if (/^[A-Za-z0-9#&.()\-]+$/.test(w)) {
      var latin = null;
      for (var li = 0; li < DIC_MODELS.length; li++) {
        if (DIC_MODELS[li].jp.toLowerCase() === w.toLowerCase()) { latin = DIC_MODELS[li].en; break; }
      }
      out.push(latin || w);
      continue;
    }

    var d = decompose(w);
    var hasUntranslatable = false;
    for (var z = 0; z < d.parts.length; z++) {
      if (/[\u3041-\u3096\u4E00-\u9FFF]/.test(d.parts[z])) { hasUntranslatable = true; break; }
    }
    if (hasUntranslatable) {
      var okParts = [];
      for (var z2 = 0; z2 < d.parts.length; z2++) {
        if (/[\u3041-\u3096\u4E00-\u9FFF]/.test(d.parts[z2])) leftover.push(d.parts[z2]);
        else okParts.push(d.parts[z2]);
      }
      if (okParts.length) out.push(okParts.join(" "));
      for (var q0 = 0; q0 < d.romaji.length; q0++) {
        romanized.push(d.romaji[q0].jp + "→" + d.romaji[q0].en);
      }
      continue;
    }

    if (d.parts.length) {
      out.push(d.parts.join(" "));
      for (var q = 0; q < d.romaji.length; q++) {
        romanized.push(d.romaji[q].jp + "→" + d.romaji[q].en);
      }
    }
  }

  return {
    en: out.join(" ").replace(/\s+/g, " ").trim(),
    romanized: romanized.join("、"),
    leftover: leftover.join(" ")
  };
}

          .trim();

function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function drawElem(ctx,e){
  if(!e.text)return null;
  var fs=e.fontSize||26, ff=e.fontFamily||"\u0027Hiragino Kaku Gothic ProN\u0027,sans-serif";
  ctx.font="bold "+fs+"px "+ff;
  var lines=e.text.split("\n"), mw=0;
  for(var i=0;i<lines.length;i++){var tw=ctx.measureText(lines[i]).width;if(tw>mw)mw=tw;}
  if(e.type==="band"){
    var px=8,py=5;
    var lh=e.lhOverride||fs;
    var bw=mw+px*2, bh=lines.length*lh+py*2;
    var bx=e.rightEdge!=null ? e.rightEdge-bw : e.x;
    ctx.fillStyle=e.bg||"#111111";
    rrect(ctx,bx,e.y,bw,bh,5);ctx.fill();
    ctx.fillStyle=e.color||"#ffffff";
    for(var j=0;j<lines.length;j++){
      var lw=ctx.measureText(lines[j]).width;
      ctx.fillText(lines[j], bx+(bw-lw)/2, e.y+py+(j+0.5)*lh+fs*0.37);
    }
    return {x:bx,y:e.y,w:bw,h:bh};
  } else {
    ctx.fillStyle=e.color||"#000000";
    var lh2=fs*1.2;
    if(e.align==="center"){
      ctx.textAlign="center";
      for(var k=0;k<lines.length;k++) ctx.fillText(lines[k],e.x,e.y+k*lh2);
      ctx.textAlign="left";
      return {x:e.x-mw/2,y:e.y-fs,w:mw,h:lines.length*lh2};
    }
    if(e.align==="right"){
      ctx.textAlign="right";
      for(var n=0;n<lines.length;n++) ctx.fillText(lines[n],e.x,e.y+n*lh2);
      ctx.textAlign="left";
      return {x:e.x-mw,y:e.y-fs,w:mw,h:lines.length*lh2};
    }
    for(var m=0;m<lines.length;m++) ctx.fillText(lines[m],e.x,e.y+m*lh2);
    return {x:e.x,y:e.y-fs,w:mw,h:lines.length*lh2};
  }
}

function renderFull(canvas,baseImg,elems){
  var W=600,H=600,dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr;canvas.height=H*dpr;
  var ctx=canvas.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  ctx.fillStyle="#ffffff";ctx.fillRect(0,0,W,H);
  if(baseImg){
    var sc=Math.min(W/baseImg.naturalWidth,H/baseImg.naturalHeight);
    ctx.drawImage(baseImg,(W-baseImg.naturalWidth*sc)/2,(H-baseImg.naturalHeight*sc)/2,baseImg.naturalWidth*sc,baseImg.naturalHeight*sc);
  }
  var bboxMap={};
  elems.forEach(function(e){
    if(e.centerOf) return;
    var bb=drawElem(ctx,e);
    if(bb) bboxMap[e.id]=bb;
  });
  elems.forEach(function(e){
    if(!e.centerOf) return;
    var ref=bboxMap[e.centerOf];
    if(ref){ drawElem(ctx,Object.assign({},e,{x:ref.x+ref.w/2+e.x})); }
    else { drawElem(ctx,Object.assign({},e,{x:(e.fallbackX!=null?e.fallbackX:300)+e.x})); }
  });
}

function mergeElems(fresh,prev){
return fresh.map(function(f){
var old=null;
for(var i=0;i<prev.length;i+=1){if(prev[i].id===f.id){old=prev[i];break;}}
if(!old)return f;
var kept={x:old.x,y:old.y,fontSize:old.fontSize};
if(old.bg!==undefined)kept.bg=old.bg;
if(old.color!==undefined)kept.color=old.color;
if(old.rightEdge!==undefined)kept.rightEdge=old.rightEdge;
if(old.lhOverride!==undefined)kept.lhOverride=old.lhOverride;
return Object.assign({},f,kept);
});
}

var bboxStore={};

function drawPreview(n,which){
var it=items[n];
var cv=$(“i”+n+”*cv”+(which===“jp”?“JP”:“EN”));
if(!cv)return;
var elems=(which===“jp”?it.elems:it.elemsEN);
var sel=(which===“jp”?it.selIds:it.selIdsEN);
var W=600,H=600,dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;
var ctx=cv.getContext(“2d”);
ctx.setTransform(1,0,0,1,0,0);
ctx.scale(dpr,dpr);
ctx.imageSmoothingEnabled=true;
ctx.imageSmoothingQuality=“high”;
ctx.fillStyle=”#ffffff”;ctx.fillRect(0,0,W,H);
if(it.imgEl){
var sc=Math.min(W/it.imgEl.naturalWidth,H/it.imgEl.naturalHeight);
ctx.drawImage(it.imgEl,(W-it.imgEl.naturalWidth*sc)/2,(H-it.imgEl.naturalHeight*sc)/2,
it.imgEl.naturalWidth*sc,it.imgEl.naturalHeight*sc);
}
var map={};
for(var i=0;i<elems.length;i+=1){
if(elems[i].centerOf)continue;
var bb=drawElem(ctx,elems[i]);
if(bb)map[elems[i].id]=bb;
}
for(var j=0;j<elems.length;j+=1){
var e=elems[j];
if(!e.centerOf)continue;
var ref=map[e.centerOf];
var ee=ref?Object.assign({},e,{x:ref.x+ref.w/2+e.x})
:Object.assign({},e,{x:(e.fallbackX!=null?e.fallbackX:300)+e.x});
var bb2=drawElem(ctx,ee);
if(bb2)map[e.id]=bb2;
}
for(var k=0;k<sel.length;k+=1){
var b=map[sel[k]];
if(!b)continue;
ctx.save();
ctx.strokeStyle=(sel.length>1?”#9933ff”:”#ff6600”);
ctx.lineWidth=3;ctx.setLineDash([6,3]);
ctx.strokeRect(b.x-5,b.y-5,b.w+10,b.h+10);
ctx.setLineDash([]);
ctx.fillStyle=(sel.length>1?”#9933ff”:”#ff6600”);
var pts=[[b.x-5,b.y-5],[b.x+b.w+5,b.y-5],[b.x-5,b.y+b.h+5],[b.x+b.w+5,b.y+b.h+5]];
for(var q=0;q<pts.length;q+=1){ctx.beginPath();ctx.arc(pts[q][0],pts[q][1],5,0,Math.PI*2);ctx.fill();}
ctx.restore();
}
bboxStore[n+”*”+which]=map;
}

function wireCanvas(n,which){
var pre=“i”+n;
var cv=$(pre+”_cv”+(which===“jp”?“JP”:“EN”));
var it=items[n];
var touch=null;

function pos(cx,cy){
var r=cv.getBoundingClientRect();
return {x:(cx-r.left)*(600/r.width),y:(cy-r.top)*(600/r.height)};
}
function hit(px,py){
var map=bboxStore[n+”_”+which]||{};
var elems=(which===“jp”?it.elems:it.elemsEN);
for(var i=elems.length-1;i>=0;i-=1){
var e=elems[i];
if(!e.text)continue;
var b=map[e.id];
if(!b)continue;
if(px>=b.x-10&&px<=b.x+b.w+10&&py>=b.y-10&&py<=b.y+b.h+10)return e.id;
}
return null;
}
function tap(cx,cy){
var p=pos(cx,cy);
var id=hit(p.x,p.y);
var sel=(which===“jp”?it.selIds:it.selIdsEN);
if(!id){
if(which===“jp”){it.selIds=[];}else{it.selIdsEN=[];}
}else{
var i=sel.indexOf(id);
if(i>=0){sel.splice(i,1);}else{sel.push(id);}
}
refresh(n);
}
cv.addEventListener(“touchstart”,function(e){
if(e.touches&&e.touches[0])touch={x:e.touches[0].clientX,y:e.touches[0].clientY};
});
cv.addEventListener(“touchend”,function(e){
e.preventDefault();
if(!touch)return;
var t=touch;touch=null;
tap(t.x,t.y);
});
cv.addEventListener(“click”,function(e){
if(touch)return;
tap(e.clientX,e.clientY);
});

var root=$(pre+”_”+which+”_body”).parentNode;
root.addEventListener(“click”,function(ev){
var sel=(which===“jp”?it.selIds:it.selIdsEN);
var elems=(which===“jp”?it.elems:it.elemsEN);
if(sel.length===0)return;
var mv=ev.target.closest(”[data-mv]”);
if(mv){
var d=mv.getAttribute(“data-mv”).split(”,”);
applySel(elems,sel,function(e){
e.x=(e.x||0)+parseInt(d[0],10);
e.y=(e.y||0)+parseInt(d[1],10);
if(e.rightEdge!=null)e.rightEdge=e.rightEdge+parseInt(d[0],10);
});
refresh(n);return;
}
var fs=ev.target.closest(”[data-fs]”);
if(fs){
var dd=parseInt(fs.getAttribute(“data-fs”),10);
var bands={};
for(var i=0;i<elems.length;i+=1){
if(sel.indexOf(elems[i].id)>=0&&elems[i].type===“band”)bands[elems[i].id]=true;
}
applySel(elems,sel,function(e){
if(e.centerOf&&bands[e.centerOf])return;
e.fontSize=Math.max(8,Math.min(120,(e.fontSize||26)+dd));
if(e.type===“band”&&e.lhOverride!=null){e.lhOverride=Math.max(8,Math.min(200,e.lhOverride+dd));}
});
refresh(n);return;
}
var tc=ev.target.closest(”[data-tc]”);
if(tc){applySel(elems,sel,function(e){e.color=tc.getAttribute(“data-tc”);});refresh(n);return;}
var bc=ev.target.closest(”[data-bc]”);
if(bc){applySel(elems,sel,function(e){e.bg=bc.getAttribute(“data-bc”);});refresh(n);return;}
});

});

var tcw=$(pre+”_”+which+”*tc”),bcw=$(pre+”*”+which+”_bc”);
var pre1=””;
for(var a=0;a<TXT_COLORS.length;a+=1){
pre1+=”<button data-tc="”+TXT_COLORS[a][1]+”" style="background:”+TXT_COLORS[a][1]
+”;color:”+(TXT_COLORS[a][0]===“白”||TXT_COLORS[a][0]===“桃”?”#000”:”#fff”)+”">”+TXT_COLORS[a][0]+”</button>”;
}
tcw.insertAdjacentHTML(“afterbegin”,pre1);
var pre2=””;
for(var b2=0;b2<BAND_COLORS.length;b2+=1){
pre2+=”<button data-bc="”+BAND_COLORS[b2][1]+”" style="background:”+BAND_COLORS[b2][1]
+”;color:”+(BAND_COLORS[b2][0]===“白”||BAND_COLORS[b2][0]===“ターコイズ”||BAND_COLORS[b2][0]===“桃”?”#000”:”#fff”)+”">”+BAND_COLORS[b2][0]+”</button>”;
}
bcw.insertAdjacentHTML(“afterbegin”,pre2);
}

function applySel(elems,sel,fn){
for(var i=0;i<elems.length;i+=1){
if(sel.indexOf(elems[i].id)<0)continue;
fn(elems[i]);
}
}

function paintCtrl(n,which){
var pre=“i”+n;
if(!$(pre+”_”+which+”*lbl”))return;
var it=items[n];
var sel=(which===“jp”?it.selIds:it.selIdsEN);
var elems=(which===“jp”?it.elems:it.elemsEN);
var first=null;
for(var i=0;i<elems.length;i+=1){if(elems[i].id===sel[0])first=elems[i];}
$(pre+”*”+which+”*lbl”).textContent=
(sel.length===0?“↑ 画像をタップして選択”:(sel.length>1?“✦ “+sel.length+“個選択中”:“✦ “+(LABELS[sel[0]]||sel[0])));
$(pre+”*”+which+”*del”).style.display=(sel.length>0?“inline-block”:“none”);
$(pre+”*”+which+”*body”).style.display=(sel.length>0?“flex”:“none”);
$(pre+”*”+which+”*cols”).style.display=(first?“block”:“none”);
$(pre+”*”+which+”*fs”).textContent=(first?(first.fontSize||26)+“px”:””);
$(pre+”*”+which+”_bandWrap”).style.display=(first&&first.type===“band”?“block”:“none”);
}

function genOne(n){
var it=items[n];
var cv=$(“i”+n+”_hidden”);
var elsJP=it.elems.map(function(e){return Object.assign({},e);});
renderFull(cv,it.imgEl,elsJP);
it.imgOut=cv.toDataURL(“image/jpeg”,0.92);
it.imgElems=elsJP;
it.imgOutEN=””;it.imgElemsEN=null;
if(it.makeEbayImg){
var elsEN=it.elemsEN.map(function(e){return Object.assign({},e);});
renderFull(cv,it.imgEl,elsEN);
it.imgOutEN=cv.toDataURL(“image/jpeg”,0.92);
it.imgElemsEN=elsEN;
}
it.titleOut=buildTitle(it.bName,it.bEN,it.model,it.penType,it.era,it.country);
it.bodyOut=buildBody(it.bName,it.bEN,it.bJP,it.model,it.modelEN,it.penType,it.material,it.colorVal,
it.era,it.country,it.cond,it.accList,it.dParts,it.dNote,it.bpS,it.fpS,it.ink,it.canWrite,
it.refill,it.extra,it.mgmt,it.refillAdapter,it.listPrice);
renderResults();
refresh(n);
}

function renderResults(){
var h=””;
for(var n=0;n<5;n+=1){
var it=items[n];
if(!it.titleOut&&!it.imgOut)continue;
h+=”<div class="res"><div class="resHead">”+NUMS[n]+” “+esc(it.bName)
+(it.model?”<div class="resSub">”+esc(it.model.split(”\n”)[0])+”</div>”:””)+”</div>”;
if(it.imgOut){
h+=”<div class="resSec"><div class="cap4">── メルカリ・ヤフオク用（日本語）</div>”;
h+=”<img src="”+it.imgOut+”" class="resImg">”;
h+=”<button class="copyImg" data-img="”+n+”,jp">📋 画像をコピー</button>”;
h+=”<div class="saveTip">コピー後、メモアプリなどでペーストして保存<br>できない時は<b>画像を長押し</b>→「"写真"に追加」</div></div>”;
}
if(it.imgOutEN){
h+=”<div class="resSec"><div class="cap4 en">── eBay用（英語）</div>”;
h+=”<img src="”+it.imgOutEN+”" class="resImg en">”;
h+=”<button class="copyImg en" data-img="”+n+”,en">🌐 eBay用画像をコピー</button></div>”;
}
h+=”<div class="resSec"><div class="cap4">── タイトル</div>”;
h+=”<div class="outBox" id="tt”+n+”">”+esc(it.titleOut)+”</div>”;
h+=”<button class="copyTxt" data-txt="tt”+n+”">📋 タイトルをコピー</button></div>”;
h+=”<div class="resSec"><div class="cap4">── 説明文</div>”;
h+=”<div class="outBox tall" id="bd”+n+”">”+esc(it.bodyOut)+”</div>”;
h+=”<button class="copyTxt" data-txt="bd”+n+”">📋 説明文をコピー</button></div>”;
h+=”</div>”;
}
var box=$(“results”);
if(!h){box.innerHTML=””;box.style.display=“none”;return;}
box.style.display=“block”;
box.innerHTML=”<div class="resTitle">── 生成結果 ──</div><div class="resGrid">”+h+”</div>”;
}

function copyImage(n,which){
var it=items[n];
var els=(which===“en”?it.imgElemsEN:it.imgElems);
if(!els){toast(“⚠ もう一度生成してください”);return;}
var cv=$(“i”+n+”_hidden”);
renderFull(cv,it.imgEl,els);
var src=cv.toDataURL(“image/png”);
var arr=src.split(”,”);
var mime=arr[0].match(/:(.*?);/)[1];
var bstr=atob(arr[1]);
var u8=new Uint8Array(bstr.length);
for(var i=0;i<bstr.length;i+=1){u8[i]=bstr.charCodeAt(i);}
var blob=new Blob([u8],{type:mime});
var ng=“⚠ コピー不可。画像を長押しして保存してください”;
if(navigator.clipboard&&window.ClipboardItem){
try{
var payload={};
payload[mime]=Promise.resolve(blob);
navigator.clipboard.write([new ClipboardItem(payload)])
.then(function(){toast(“✓ “+NUMS[n]+” 画像をコピーしました”);})
.catch(function(){toast(ng);});
}catch(e){toast(ng);}
}else{toast(ng);}
}

function wireResults(){
$(“results”).addEventListener(“click”,function(ev){
var ci=ev.target.closest(”[data-img]”);
if(ci){
var p=ci.getAttribute(“data-img”).split(”,”);
copyImage(parseInt(p[0],10),p[1]);
return;
}
var ct=ev.target.closest(”[data-txt]”);
if(ct){
var el=$(ct.getAttribute(“data-txt”));
if(!el)return;
navigator.clipboard.writeText(el.textContent)
.then(function(){toast(“✓ コピーしました”);})
.catch(function(){toast(“⚠ コピーできませんでした”);});
}
});
}

try{
boot();
wireResults();
}catch(e){
if(window.penShowError){
window.penShowError(“起動できませんでした”,(e&&e.message?e.message:e)+”\n\n”+(e&&e.stack?e.stack:””));
}
}

</script>
